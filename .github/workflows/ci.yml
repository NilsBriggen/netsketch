# Tests on every push and pull request. A tag like v0.2.0 also builds the downloads (Linux AppImage,
# Windows installer and portable .exe, macOS archive, Android phone app) and publishes them as one
# GitHub release, with the notes from .github/release-notes/<tag>.md.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux libraries for the window and file dialogs
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgtk-3-dev libwayland-dev
      - run: cargo build --locked
      - run: cargo test --locked

  linux:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    # The oldest supported Ubuntu: an AppImage runs on systems at least as new as the one it was built on.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgtk-3-dev libwayland-dev
      - run: cargo build --release --locked
      - name: Pack the AppImage
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp target/release/netsketch AppDir/usr/bin/
          cp packaging/netsketch.desktop AppDir/ && cp packaging/netsketch.desktop AppDir/usr/share/applications/
          cp packaging/netsketch.png AppDir/ && cp packaging/netsketch.png AppDir/usr/share/icons/hicolor/256x256/apps/
          ln -s usr/bin/netsketch AppDir/AppRun
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir NetSketch-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: NetSketch-x86_64.AppImage

  windows:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Build the installer (WiX 5)
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          dotnet tool install --global wix --version 5.0.2
          wix build packaging/netsketch.wxs -arch x64 -d Version=$version -d Exe=target/release/netsketch.exe -o NetSketch-$version-x64.msi
          cp target/release/netsketch.exe NetSketch-$version-x64-portable.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            *.msi
            *-portable.exe

  macos:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      # A tar keeps the "may run" flag that a plain download loses.
      - run: tar -czf netsketch-macos-arm64.tar.gz -C target/release netsketch
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: netsketch-macos-arm64.tar.gz

  android:
    # The phone app builds on every push (so a broken build shows early); tags publish it.
    runs-on: ubuntu-latest
    env:
      KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android platform 35 and build tools
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      # With the ANDROID_KEYSTORE secret (base64 of signing.keystore) every release is signed with the same
      # key, so a new version installs over the old one. Without it, build.sh makes a throwaway key.
      - name: Signing key
        if: env.KEYSTORE != ''
        run: echo "$KEYSTORE" | base64 -d > companion-android/signing.keystore
      - run: ./companion-android/build.sh
      - if: startsWith(github.ref, 'refs/tags/v')
        run: cp companion-android/NetSketch-Survey.apk "NetSketch-Survey-${GITHUB_REF_NAME#v}.apk"
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: NetSketch-Survey-*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          name: NetSketch ${{ github.ref_name }}
          body_path: .github/release-notes/${{ github.ref_name }}.md
          # v0.1-beta, v1.0-rc1 …: anything with a dash is a pre-release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: dist/*
